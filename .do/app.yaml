name: vidco-dijital-yardim-asistani
region: fra

services:
  - name: backend
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    routes:
      - path: /api
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
    envs:
      - key: GOOGLE_API_KEY
        type: SECRET
      - key: DEEPSEEK_API_KEY
        type: SECRET
      - key: DATABASE_URL
        type: SECRET
      - key: REDIS_URL
        type: SECRET
      - key: WIDGET_API_KEY
        type: SECRET
      - key: JWT_SECRET
        type: SECRET
      - key: JWT_ALGORITHM
        value: "HS256"
      - key: WIDGET_BOT_ID
        value: "bot_vidco_17020"
      - key: VECTOR_COLLECTION
        value: "vidco_17020"
      - key: EMBEDDING_MODEL
        value: "models/gemini-embedding-001"
      - key: CHAT_MODEL
        value: "gemini-2.5-flash-lite"
      - key: CHAT_PROVIDER
        value: "deepseek"
      - key: DEEPSEEK_MODEL
        value: "deepseek-chat"
      - key: ALLOWED_ORIGINS
        value: "*.voc-tester.com"

static_sites:
  - name: frontend
    source_dir: frontend
    build_command: npm ci && npm run build
    output_dir: dist
    catchall_document: index.html
    routes:
      - path: /
    envs:
      - key: VITE_API_URL
        value: "https://chatbot.voc-tester.com"
        scope: BUILD_TIME